<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Редактор на сайта</title>
<style>
:root{--bg:#F1F3F4;--ink:#0E1A22;--mut:#55636d;--line:#D5DBDF;--card:#fff;--acc:#2747F5;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1317;--ink:#E8EEF1;--mut:#93a1ab;--line:#25323a;--card:#131D23;--acc:#7D95FF;--on:#0C1317;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.w{max-width:860px;margin:0 auto;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-weight:500;font-size:14px;margin:0 0 10px}
input,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:80px;resize:vertical}
.r2,.r3{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.th{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}.th div{position:relative}.th img{height:64px;border-radius:6px;display:block}
.th button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:#d33;color:#fff;cursor:pointer;line-height:1}
.btn,.sm{border:0;border-radius:8px;background:var(--acc);color:var(--on);font:inherit;font-weight:500;padding:9px 16px;cursor:pointer}
.sm{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-size:14px}
.ac{display:flex;gap:8px;flex-wrap:wrap}.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.pv{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:10px}.pv img{max-height:44px;max-width:240px;border-radius:6px}
@media (max-width:640px){.r2,.r3{grid-template-columns:1fr}}
</style>
<script src="content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head><body>
<div class="bar"><b>Редактор на сайта</b><button class="btn" id="dl" type="button">Свали пакет (ZIP)</button></div>
<div class="w">
<p class="hint">Тук променяш съдържанието, а сайтът се обновява, когато качиш свалените файлове на хостинга. Нищо не се записва автоматично. Снимките се смаляват автоматично.</p>
<div class="box"><h2>Марка и банер</h2>
<label>Име на сайта<input id="brand"></label>
<label>Лого (PNG, SVG или JPG)<input type="file" id="f-logo" accept="image/*"></label><div class="pv" id="lg"></div>
<label>Банер (широка снимка)<input type="file" id="f-banner" accept="image/*"></label><div class="pv" id="bn"></div>
</div>
<h2>Проекти</h2>
<div id="list"></div>
<button class="btn" id="add" type="button">Нов проект</button>
<datalist id="tags"></datalist>
</div>
<script>
const $ = s => document.querySelector(s);
const D = JSON.parse(JSON.stringify(window.SITE || {}));
D.brand ||= "3D Печат"; D.logo ||= ""; D.banner ||= ""; D.projects ||= [];
D.projects.forEach((p, i) => { p.id ||= "p" + i; p.imgs ||= []; p.video ||= ""; });
const pend = new Map(); let dirty = false;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src = p => pend.has(p) ? pend.get(p).url : p;
const stamp = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
function add(file, path, o){ pend.set(path, {file, url: URL.createObjectURL(file), ...o}); }
const ext = (f, png) => f.type === "image/svg+xml" ? "svg" : png ? "png" : "jpg";

async function shrink(file, max, png){
  if(file.type === "image/svg+xml") return file;
  const b = await createImageBitmap(file), r = Math.min(1, max / Math.max(b.width, b.height));
  const c = document.createElement("canvas"); c.width = Math.round(b.width * r); c.height = Math.round(b.height * r);
  c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, png ? "image/png" : "image/jpeg", .82));
}

function draw(){
  $("#brand").value = D.brand;
  for(const [k, id] of [["logo","lg"],["banner","bn"]])
    $("#" + id).innerHTML = D[k] ? `<img src="${esc(src(D[k]))}" alt=""><button class="sm" data-rm="${k}" type="button">Махни</button>` : "";
  $("#tags").innerHTML = [...new Set(D.projects.map(p => p.tag).filter(Boolean))].map(t => `<option value="${esc(t)}">`).join("");
  const th = p => p.imgs.map((s, j) => `<div><img src="${esc(src(s))}" alt=""><button type="button" data-act="rm" data-j="${j}" aria-label="Махни снимката">×</button></div>`).join("");
  $("#list").innerHTML = D.projects.map((p, i) => `<div class="box" data-i="${i}">
<div class="r2"><label>Заглавие<input data-k="title" value="${esc(p.title)}"></label><label>Категория<input data-k="tag" list="tags" value="${esc(p.tag)}"></label></div>
<div class="r3"><label>Материал<input data-k="material" value="${esc(p.material)}"></label><label>Часове печат<input data-k="hours" type="number" step="0.5" value="${p.hours ?? ""}"></label><label>Грамове<input data-k="grams" type="number" value="${p.grams ?? ""}"></label></div>
<label>Описание<textarea data-k="text">${esc(p.text)}</textarea></label>
<div class="th">${th(p)}</div>
<label>Добави снимки (първата е основна)<input type="file" accept="image/*" multiple data-act="img"></label>
<label>Видео: YouTube линк<input data-k="video" value="${esc(p.video)}" placeholder="https://youtu.be/..."></label>
<label>Или MP4 файл (до около 20 МБ)<input type="file" accept="video/mp4" data-act="vid"></label>
<div class="ac"><button class="sm" type="button" data-act="up">Нагоре</button><button class="sm" type="button" data-act="down">Надолу</button><button class="sm" type="button" data-act="del">Изтрий проекта</button></div></div>`).join("") || `<p class="hint">Още няма проекти.</p>`;
}

$("#brand").oninput = e => { D.brand = e.target.value; dirty = true; };
for(const [k, max, png] of [["logo", 500, 1], ["banner", 2000, 0]])
  $("#f-" + k).onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const path = `images/${k}-${stamp()}.${ext(f, png)}`;
    add(f, path, {kind: "img", max, png}); D[k] = path; dirty = true; e.target.value = ""; draw();
  };
document.addEventListener("click", e => { const r = e.target.closest("[data-rm]"); if(r){ D[r.dataset.rm] = ""; dirty = true; draw(); } });

$("#list").addEventListener("input", e => {
  const t = e.target, k = t.dataset.k; if(!k) return;
  D.projects[t.closest("[data-i]").dataset.i][k] = t.type === "number" ? (+t.value || 0) : t.value; dirty = true;
});
$("#list").addEventListener("change", e => {
  const t = e.target; if(t.type !== "file" || !t.files.length) return;
  const p = D.projects[t.closest("[data-i]").dataset.i], s = stamp();
  if(t.dataset.act === "img") [...t.files].forEach((f, n) => { const path = `images/${p.id}-${s}${n}.${ext(f)}`; add(f, path, {kind: "img", max: 1600}); p.imgs.push(path); });
  else { const path = `videos/${p.id}-${s}.mp4`; add(t.files[0], path, {kind: "video"}); p.video = path; }
  dirty = true; draw();
});
$("#list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const i = +b.closest("[data-i]").dataset.i, L = D.projects, a = b.dataset.act;
  if(a === "del"){ if(!confirm("Да изтрия ли този проект?")) return; L.splice(i, 1); }
  else if(a === "up" && i > 0) [L[i-1], L[i]] = [L[i], L[i-1]];
  else if(a === "down" && i < L.length - 1) [L[i+1], L[i]] = [L[i], L[i+1]];
  else if(a === "rm") L[i].imgs.splice(+b.dataset.j, 1);
  dirty = true; draw();
});
$("#add").onclick = () => { D.projects.unshift({id: "n" + stamp(), title: "Нов проект", tag: "", material: "", hours: 0, grams: 0, text: "", imgs: [], video: ""}); dirty = true; draw(); scrollTo(0, 220); };

$("#dl").onclick = async () => {
  const btn = $("#dl"); btn.disabled = true; btn.textContent = "Подготвям...";
  try{
    const z = new JSZip(), used = new Set([D.logo, D.banner, ...D.projects.flatMap(p => [...p.imgs, p.video])]);
    for(const [path, m] of pend){
      if(!used.has(path)) continue;
      z.file(path, m.kind === "video" ? m.file : await shrink(m.file, m.max, m.png));
    }
    z.file("content.js", "window.SITE = " + JSON.stringify(D, null, 2) + ";\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(await z.generateAsync({type: "blob"}));
    a.download = "site-update.zip"; a.click(); dirty = false;
  }catch(err){ alert("Неуспешно създаване на пакета: " + err.message); }
  btn.disabled = false; btn.textContent = "Свали пакет (ZIP)";
};
addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });
draw();
</script>
</body></html>
